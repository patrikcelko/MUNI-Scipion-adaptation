name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff (Controller)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check
        working-directory: container_controller
        run: ruff check .

      - name: Ruff format check
        working-directory: container_controller
        run: ruff format --check .

  pyright:
    name: Pyright (Controller)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: container_controller
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          pip install pyright

      - name: Pyright
        working-directory: container_controller
        run: pyright controller/

  ruff-monitor:
    name: Ruff (Task Monitor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check
        working-directory: task_monitor
        run: ruff check .

      - name: Ruff format check
        working-directory: task_monitor
        run: ruff format --check .

  pyright-monitor:
    name: Pyright (Task Monitor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: task_monitor
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          pip install pyright

      - name: Pyright
        working-directory: task_monitor
        run: pyright monitor/ tests/
