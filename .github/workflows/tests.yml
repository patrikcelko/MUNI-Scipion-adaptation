name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  controller-tests:
    name: Controller tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: container_controller
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Run controller tests
        working-directory: container_controller
        run: pytest --tb=short -q

  docker-tests:
    name: Docker tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=9.0.2" "PyYAML>=6.0.2"

      - name: Run docker tests
        working-directory: docker
        run: pytest --tb=short -q

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint (default values)
        run: helm lint helm/

      - name: Lint (with controller)
        run: helm lint helm/ -f helm/values-controller.yaml

      - name: Template renders (default)
        run: helm template test helm/ > /dev/null

      - name: Template renders (with controller)
        run: helm template test helm/ -f helm/values-controller.yaml > /dev/null

  monitor-tests:
    name: Task Monitor tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: task_monitor
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Run task monitor tests
        working-directory: task_monitor
        run: pytest --tb=short -q
