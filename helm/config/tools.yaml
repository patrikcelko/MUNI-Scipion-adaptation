# Mapping: protocol class name + command prefix -> container image for job pod execution.
#
# protocol: regex matched against the Scipion protocol class name (like XmippProtMovieGain)
# match: regex matched against the first word of the raw command (used as fallback)
# gpu_protocols: list of specific protocol class names within this tool that require GPU
# default: if true, used as the fallback when no protocol/match is found

# Relion
- protocol: ".*Relion"
  match: "^relion_.*"
  image: cerit.io/scipion/relion:latest
  needsGpu: false
  enabled: true

# Xmipp
- protocol: "Xmipp"
  match: "^xmipp_.*"
  image: cerit.io/scipion/xmipp:latest
  needsGpu: false
  gpu_protocols:
    - XmippProtMovieCorr
  enabled: true

# MotionCor2
- protocol: ".*MotionCor"
  match: "^motioncor2(\\b|_)"
  image: cerit.io/scipion/motioncor2:latest
  needsGpu: true
  enabled: false

# CTFFind (CisTEM suite)
- protocol: "Cistem|.*CTFFind"
  match: "^ctffind4(\\b|_)"
  image: cerit.io/scipion/ctffind4:latest
  needsGpu: false
  enabled: true

# Gctf
- protocol: ".*Gctf|ProtGctf"
  match: "^Gctf(\\b|_)"
  image: cerit.io/scipion/gctf:latest
  needsGpu: true
  enabled: false

# EMAN2
- protocol: "Eman"
  match: "^e2.*"
  image: cerit.io/scipion/eman2:latest
  needsGpu: false
  enabled: false

# Scipion framework (+ unmatched protocols)
- protocol: ".*"
  match: "^python3.*"
  image: cerit.io/scipion/scipion3-remote:latest
  needsGpu: false
  default: true
  enabled: true
