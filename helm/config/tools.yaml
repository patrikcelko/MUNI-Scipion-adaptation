# Mapping: protocol class name + command prefix -> container image for job pod execution.
#
# protocol: regex matched against the Scipion protocol class name (like XmippProtMovieGain)
# match: regex matched against the first word of the raw command (used as fallback)
# gpu_protocols: list of specific protocol class names within this tool that require GPU
# default: if true, used as the fallback when no protocol/match is found

# Relion
- protocol: ".*Relion"
  match: "^relion_.*"
  image: harbor.celko.cz/scipion-adaptation/relion:v3
  needsGpu: false
  enabled: true

# Xmipp
- protocol: "Xmipp"
  match: "^xmipp_.*"
  image: harbor.celko.cz/scipion-adaptation/xmipp:v3
  needsGpu: false
  gpu_protocols:
    - XmippProtMovieCorr
  enabled: true

# MotionCor2
- protocol: ".*MotionCor"
  match: "^motioncor2(\\b|_)"
  image: harbor.celko.cz/scipion-adaptation/motioncor2:v2
  needsGpu: true
  enabled: false

# CTFFind (Cistem suite)
- protocol: "Cistem|.*CTFFind"
  match: "^ctffind4(\\b|_)"
  image: harbor.celko.cz/scipion-adaptation/ctffind4:v4
  needsGpu: false
  enabled: true

# Gctf
- protocol: ".*Gctf|ProtGctf"
  match: "^Gctf(\\b|_)"
  image: harbor.celko.cz/scipion-adaptation/gctf:v2
  needsGpu: true
  enabled: false

# EMAN2
- protocol: "Eman"
  image: harbor.celko.cz/scipion-adaptation/eman2:v1
  needsGpu: false
  enabled: false

# Scipion framework (+ unmatched protocols)
- match: "^python3.*"
  image: harbor.celko.cz/scipion-adaptation/scipion3-remote:latest
  needsGpu: false
  default: true
  enabled: true
