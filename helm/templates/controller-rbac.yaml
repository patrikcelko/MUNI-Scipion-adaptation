{{- $ctl := .Values.controller | default dict -}}
{{- if and (kindIs "map" $ctl) ($ctl.enabled | default false) }}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: container-controller
  labels:
{{ include "scipion3-remote.labels" . | indent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: container-controller
  labels:
{{ include "scipion3-remote.labels" . | indent 4 }}
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create","get","list","watch","delete","patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get","list","watch","delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get","list","watch"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get","list"]
- apiGroups: [""]
  resources: ["configmaps","secrets"]
  verbs: ["get","list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: container-controller
  labels:
{{ include "scipion3-remote.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: container-controller
subjects:
- kind: ServiceAccount
  name: container-controller
{{- end }}
