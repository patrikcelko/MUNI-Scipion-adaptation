{{- $ctl := .Values.controller | default dict -}}
{{- if and (kindIs "map" $ctl) ($ctl.enabled | default false) }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: container-controller
  labels:
{{ include "scipion3-remote.labels" . | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: container-controller
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: container-controller
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: container-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: controller
        image: "{{ $ctl.image.repository }}:{{ $ctl.image.tag }}"
        imagePullPolicy: {{ $ctl.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 5000
        env:
        - name: NAMESPACE
          valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
        - name: JOBS_TTL
          value: "{{ $ctl.jobsTTL }}"
        - name: JOBS_CLEANUP_INTERVAL
          value: "{{ default 120 $ctl.jobsCleanupInterval }}"
        - name: MAX_FINISHED_JOBS
          value: "{{ default 3 $ctl.maxFinishedJobs }}"
        - name: STORAGE_MODE
          value: "{{ $ctl.storageMode }}"
        - name: PROJECTS_PVC
          value: "{{ $ctl.projectsPVC }}"
        - name: PVC_SUB_PATH
          value: "{{ default "projects" $ctl.pvcSubPath }}"
        - name: LOCAL_PATH
          value: "{{ $ctl.localPath }}"
        - name: TOOLMAP_PATH
          value: "/config/tools.yaml"
        - name: WORKER_PULL_POLICY
          value: "{{ default "Always" $ctl.workerPullPolicy }}"
        - name: RESTRICTED_SECURITY_CONTEXT
          value: "{{ default false $ctl.restrictedSecurityContext }}"
        - name: ONEDATA_ENABLED
          value: "{{ $ctl.onedata.enabled }}"
        - name: ONECLIENT_IMAGE
          value: "{{ $ctl.onedata.image }}"
        - name: ONECLIENT_PROVIDER
          value: "{{ $ctl.onedata.provider }}"
        - name: ONECLIENT_SPACE
          value: "{{ $ctl.onedata.space }}"
        - name: ONECLIENT_TOKEN_SECRET
          value: "{{ $ctl.onedata.tokenSecret }}"
        - name: ONECLIENT_EXTRA
          value: '{{ toJson ($ctl.onedata.extraArgs | default (list)) }}'
        - name: NODE_SELECTOR_JSON
          value: '{{ toJson ($ctl.nodeSelectorJson | default (dict)) }}'
        - name: TOLERATIONS_JSON
          value: '{{ toJson ($ctl.tolerationsJson | default (list)) }}'
        - name: VNC_PORT
          value: "{{ default 31335 $ctl.vncNodePort }}"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: projects
          mountPath: "{{ $ctl.localPath }}"
{{- if $ctl.onedata.enabled }}
        - name: datasets-vol
          mountPath: /datasets
{{- end }}
        resources:
{{ toYaml ($ctl.resources | default (dict)) | indent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        readinessProbe:
          httpGet: { path: /healthz, port: 5000 }
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /healthz, port: 5000 }
          initialDelaySeconds: 10
          periodSeconds: 10

{{- if $ctl.onedata.enabled }}
      - name: onedata
        image: "{{ $ctl.onedata.image }}"
        args:
          - "--provider={{ $ctl.onedata.provider }}"
          - "--space={{ $ctl.onedata.space }}"
{{- range $ctl.onedata.extraArgs }}
          - "{{ . }}"
{{- end }}
        env:
          - name: ONECLIENT_ACCESS_TOKEN
            valueFrom:
              secretKeyRef:
                name: "{{ $ctl.onedata.tokenSecret }}"
                key: TOKEN
        securityContext:
          privileged: true
          capabilities:
            add: ["SYS_ADMIN"]
        volumeMounts:
          - name: datasets-vol
            mountPath: /datasets
            mountPropagation: Bidirectional
{{- end }}

      volumes:
      - name: config
        configMap:
          name: container-controller-config
      - name: projects
        persistentVolumeClaim:
          claimName: {{ $ctl.projectsPVC }}
{{- if $ctl.onedata.enabled }}
      - name: datasets-vol
        emptyDir: {}
{{- end }}
{{- end }}
