[project]
name = "scipion-docker"
version = "1.0.0"
description = "Docker images, scripts, and config test environment."
requires-python = ">=3.13"

[project.optional-dependencies]
test = [
    "pytest>=9.0.2",
    "PyYAML>=6.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff.format]
quote-style = "single"
