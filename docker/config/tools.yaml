# Mapping: command prefix -> container image for job pod execution.
#
# NOTE: The controller also uses protocol-based routing (choose_tool_by_protocol)
# which maps Scipion protocol class names to these containers.

# Relion
- match: "^relion_.*"
  image: harbor.celko.cz/scipion-adaptation/relion:v3
  needsGpu: false
  enabled: true

# Xmipp
- match: "^xmipp_.*"
  image: harbor.celko.cz/scipion-adaptation/xmipp:v3
  needsGpu: false
  enabled: true

# MotionCor2
- match: "^motioncor2(\\b|_)"
  image: harbor.celko.cz/scipion-adaptation/motioncor2:v2
  needsGpu: true
  enabled: false

# CTFFind
- match: "^ctffind4(\\b|_)"
  image: harbor.celko.cz/scipion-adaptation/ctffind4:v4
  needsGpu: false
  enabled: true

# Gctf
- match: "^Gctf(\\b|_)"
  image: harbor.celko.cz/scipion-adaptation/gctf:v2
  needsGpu: true
  enabled: false

# Scipion framework (fallback)
- match: "^python3.*"
  image: harbor.celko.cz/scipion-adaptation/scipion3-remote:v3
  needsGpu: false
  enabled: true
